services:
    mailpit:
        image: axllent/mailpit:v1.30.5
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: "1"
            MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        networks:
            - legendhub
        ports:
            - target: 8025
              published: "8025"
              host_ip: 127.0.0.1
              protocol: tcp
        restart: unless-stopped
    mysql:
        volumes: !override
            - mariadb-database:/var/lib/mysql
            - database-logs:/var/log
            - ./mysql/mariadb-conf:/etc/mysql/conf.d:ro
            - type: bind
              source: ${LEGENDHUB_LOCAL_STATE_DIR:?set LEGENDHUB_LOCAL_STATE_DIR}/backups/dunwich-latest.sql.gz
              target: /docker-entrypoint-initdb.d/01-dunwich.sql.gz
              read_only: true
    www:
        depends_on:
            mailpit:
                condition: service_healthy
        ports: !reset []
        volumes: !reset []
        environment:
            RECAPTCHA_SITEKEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
            RECAPTCHA_SECRET: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
            SMTP_HOST: mailpit
            SMTP_PORT: "1025"
            SMTP_SECURE: "false"
            SMTP_USER: local-test
            SMTP_PASSWORD: local-test-password
            SMTP_FROM: LegendHUB <noreply@localhost>
            APP_BASE_URL: https://localhost
    nginx:
        image: nginx:1.27-alpine
        depends_on:
            www:
                condition: service_started
        networks:
            - legendhub
        ports:
            - target: 443
              published: "443"
              host_ip: 127.0.0.1
              protocol: tcp
        volumes:
            - type: bind
              source: ./nginx/local.conf
              target: /etc/nginx/conf.d/default.conf
              read_only: true
            - type: bind
              source: ${LEGENDHUB_LOCAL_STATE_DIR:?set LEGENDHUB_LOCAL_STATE_DIR}/tls/localhost.pem
              target: /etc/nginx/tls/localhost.pem
              read_only: true
            - type: bind
              source: ${LEGENDHUB_LOCAL_STATE_DIR:?set LEGENDHUB_LOCAL_STATE_DIR}/tls/localhost-key.pem
              target: /etc/nginx/tls/localhost-key.pem
              read_only: true
        restart: unless-stopped
