name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website:
    name: Website tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  styles:
    name: Stylesheet tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: css
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: css/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
