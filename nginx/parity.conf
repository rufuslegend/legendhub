log_format legendhub_safe '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"$http_user_agent"';

server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;
    access_log /var/log/nginx/access.log legendhub_safe;

    ssl_certificate /etc/nginx/tls/localhost.pem;
    ssl_certificate_key /etc/nginx/tls/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://www:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
    }
}
